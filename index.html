<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f7">
<title>FerentsOS — Your life. Your system.</title>
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#fff;--side:#f7f7f5;--text:#252522;--muted:#858580;--border:#e9e9e6;--hover:#ecece9;--accent:#327c6e;--accentbg:#e8f4ef;--surface:#fafaf9;--shadow:0 10px 40px #00000015;color:var(--text);background:var(--bg)}
:root.dark{--bg:#191919;--side:#202020;--text:#e8e8e5;--muted:#a2a29c;--border:#333330;--hover:#30302e;--accent:#79b7a0;--accentbg:#283b33;--surface:#242423;--shadow:0 10px 40px #0008;color-scheme:dark}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{display:flex;min-height:100vh}.sidebar{width:252px;min-width:252px;background:var(--side);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:14px 9px;border-right:1px solid var(--border)}.brand{display:flex;align-items:center;gap:9px;padding:8px 10px;font-weight:740;font-size:15px}.logo{display:grid;place-items:center;width:29px;height:29px;border-radius:8px;background:#2d6b60;color:white;font-size:16px;letter-spacing:-1px}.pill{margin-left:auto;font-size:10px;font-weight:600;border:1px solid var(--border);border-radius:7px;padding:4px 6px;color:var(--muted)}.nav{margin-top:19px}.group-label{padding:20px 12px 7px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}.item{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;border-radius:7px;padding:10px 12px;background:transparent;color:var(--text);font-size:13px}.item:hover{background:var(--hover)}.item.active{background:var(--hover);font-weight:650}.ico{font-size:17px;display:inline-grid;place-items:center;width:21px}.item .count{margin-left:auto;font-size:11px;color:var(--muted)}.side-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}.main{min-width:0;flex:1}.topbar{height:62px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:0 36px;gap:16px}.breadcrumbs{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:9px}.breadcrumbs strong{color:var(--text);font-weight:600}.top-actions{display:flex;align-items:center;gap:7px}.icon-btn{background:none;border:0;color:var(--muted);border-radius:7px;padding:8px 10px}.icon-btn:hover{background:var(--hover)}.avatar{width:29px;height:29px;border-radius:50%;background:#dde8dc;color:#315b4f;display:grid;place-items:center;font-size:12px;font-weight:800}.content{max-width:1010px;margin:0 auto;padding:62px 70px 90px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:700;color:var(--accent)}h1{font-size:40px;letter-spacing:-.047em;line-height:1.15;margin:14px 0 10px;font-weight:760}.subtitle{color:var(--muted);line-height:1.7;font-size:14px;margin:0 0 36px}.section-heading{display:flex;justify-content:space-between;align-items:center;margin:37px 0 15px;gap:12px}.section-heading h2{margin:0;font-size:17px;letter-spacing:-.025em}.small-link{border:0;background:transparent;color:var(--muted);font-size:12px}.small-link:hover{color:var(--accent)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid var(--border);background:var(--bg);border-radius:11px;padding:18px;min-height:130px;text-align:left;color:var(--text);transition:.15s}.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}.card .symbol{font-size:23px}.card h3{font-size:14px;margin:13px 0 5px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.panel{border:1px solid var(--border);border-radius:12px;padding:19px;min-height:200px}.panel-title{font-size:13px;font-weight:720;margin:0 0 16px}.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}.task:last-child{border-bottom:0}.task input{accent-color:var(--accent);width:16px;height:16px}.task.done span{text-decoration:line-through;color:var(--muted)}.date{margin-left:auto;color:var(--muted);font-size:11px}.note-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}.note-row:last-child{border:0}.note-row small{display:block;color:var(--muted);margin-top:5px}.banner{border:1px dashed var(--border);background:var(--surface);border-radius:12px;padding:20px;margin-top:24px;font-size:13px;line-height:1.7;color:var(--muted)}.add{display:flex;gap:8px;margin-top:16px}.add input{min-width:0;flex:1;border:1px solid var(--border);border-radius:8px;padding:11px 12px;background:var(--bg);color:var(--text);font-size:13px}.primary{border:0;border-radius:8px;padding:11px 14px;color:white;background:#347f6d;font-size:13px;font-weight:600}.primary:hover{background:#286554}.chip{display:inline-flex;background:var(--accentbg);color:var(--accent);font-weight:650;font-size:11px;padding:6px 9px;border-radius:6px}.module-card{border:1px solid var(--border);border-radius:12px;padding:21px}.module-card h3{margin:10px 0 8px;font-size:16px}.module-card p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.project-list{display:grid;gap:10px}.project{border:1px solid var(--border);border-radius:10px;padding:19px;display:flex;align-items:center;gap:14px}.project-title{font-weight:650;font-size:14px}.project-sub{font-size:12px;color:var(--muted);margin-top:4px}.project .arrow{margin-left:auto;color:var(--muted)}.mobile-head{display:none}.overlay{display:none}.hidden{display:none!important}.empty{font-size:13px;color:var(--muted);padding:12px 0}.searchbar{width:100%;padding:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px}.footer{font-size:11px;color:var(--muted);margin-top:50px}.textarea{width:100%;min-height:260px;resize:vertical;border:1px solid var(--border);border-radius:9px;padding:15px;background:var(--bg);color:var(--text);line-height:1.65}.toast{position:fixed;bottom:22px;right:22px;padding:12px 17px;background:var(--text);color:var(--bg);border-radius:9px;box-shadow:var(--shadow);font-size:12px;z-index:5}
@media(max-width:930px){.content{padding:44px 35px 70px}.cards{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}@media(max-width:670px){.sidebar{position:fixed;z-index:12;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.overlay.on{display:block;position:fixed;inset:0;background:#0007;z-index:11}.mobile-head{display:inline-flex}.topbar{padding:0 18px;height:55px}.content{padding:37px 22px 60px}h1{font-size:34px}.cards{grid-template-columns:1fr 1fr;gap:9px}.card{padding:14px;min-height:118px}.top-actions .hide-mobile{display:none}}
</style>
</head>
<body><div id="overlay" class="overlay"></div><div class="app"><aside id="sidebar" class="sidebar"><div class="brand"><div class="logo">F.</div>FerentsOS <span class="pill">0.1</span></div><div class="nav" id="nav"></div><div class="side-bottom"><button class="item" id="themeSide"><span class="ico">◐</span><span>Змінити тему</span></button><button class="item" data-page="settings"><span class="ico">⚙</span><span>Налаштування</span></button></div></aside><main class="main"><header class="topbar"><div class="breadcrumbs"><button id="menuBtn" class="icon-btn mobile-head" aria-label="Відкрити меню">☰</button><span>FerentsOS</span><span>/</span><strong id="crumb">Головна</strong></div><div class="top-actions"><button id="searchBtn" title="Пошук" class="icon-btn">⌕</button><button id="themeBtn" title="Змінити тему" class="icon-btn hide-mobile">◐</button><span class="avatar" title="Демо-профіль">F</span></div></header><div class="content" id="page"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const navGroups=[{name:'ОСНОВНЕ',items:[['home','⌂','Головна'],['tasks','☑','Завдання'],['notes','▤','Нотатки'],['goals','◎','Цілі'],['projects','◫','Проєкти']]},{name:'МОДУЛІ',items:[['food','♨','Харчування'],['fitness','◇','Тренування'],['finance','▥','Фінанси'],['ideas','✧','Ідеї']]},{name:'ПРОСТОРИ',items:[['personal','♙','Особистий'],['shared','♧','Спільний']] }];
const sections={home:'Головна',tasks:'Завдання',notes:'Нотатки',goals:'Цілі',projects:'Проєкти',food:'Харчування',fitness:'Тренування',finance:'Фінанси',ideas:'Ідеї',personal:'Особистий простір',shared:'Спільний простір',settings:'Налаштування',search:'Пошук'};
let current='home';let tasks=[{title:'Придумати структуру FerentsOS',date:'Сьогодні',done:false},{title:'Протестувати перший прототип',date:'Сьогодні',done:false},{title:'Спланувати наступні модулі',date:'Пізніше',done:false}];
let notes=[{title:'Ідея: персональна система',desc:'Думки про можливості Second Brain',body:'FerentsOS — власна система для знань, проєктів, планів, завдань і майбутніх модулів.'},{title:'Плани на майбутнє',desc:'Особисті та спільні плани',body:'Тут згодом будуть твої плани.'}];
const projectData=[['💻','FerentsOS','Розробка власної цифрової системи'],['🌍','Подорожі','Маршрути, місця та плани'],['🏡','Домашні справи','Покупки, ремонт і спільні ідеї']];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notice(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add('hidden'),2800)}
function header(title,sub,eyebrow='ТВІЙ ПРОСТІР'){return `<div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${sub}</p>`}
function taskList(){return tasks.length?tasks.map((t,i)=>`<label class="task ${t.done?'done':''}"><input type="checkbox" data-check="${i}" ${t.done?'checked':''}><span>${esc(t.title)}</span><span class="date">${esc(t.date)}</span></label>`).join(''):'<div class="empty">Тут поки немає завдань.</div>'}
function noteList(){return notes.map((n,i)=>`<div class="note-row"><span class="ico">📄</span><div><strong>${esc(n.title)}</strong><small>${esc(n.desc)}</small></div></div>`).join('')}
function cards(){return [['tasks','☑','Завдання','Плани, дедлайни та списки справ'],['notes','▤','Нотатки','Ідеї, знання та важливі матеріали'],['goals','◎','Цілі','Твої амбіції та довгостроковий прогрес'],['projects','◫','Проєкти','Усе потрібне для великих задумів'],['food','♨','Харчування','Рецепти, калорії та планування меню'],['fitness','◇','Тренування','Журнал активності й результати']].map(a=>`<button class="card" data-page="${a[0]}"><span class="symbol">${a[1]}</span><h3>${a[2]}</h3><p>${a[3]}</p></button>`).join('')}
function home(){return header('Твій простір для всього.','Організовуй життя, фіксуй ідеї та поступово будуй систему, яка працює саме для тебе.','WELCOME TO FERENTSOS')+`<span class="chip">✦ Версія 0.1 · Інтерактивний прототип</span><div class="section-heading"><h2>Твій робочий простір</h2><span class="small-link">6 розділів</span></div><div class="cards">${cards()}</div><div class="section-heading"><h2>Швидкий огляд</h2><button class="small-link" data-page="tasks">Усі завдання →</button></div><div class="two-col"><div class="panel"><div class="panel-title">☑ Завдання</div>${taskList()}</div><div class="panel"><div class="panel-title">▤ Останні нотатки</div>${noteList()}</div></div><div class="banner">💡 <b>Тут починається FerentsOS.</b> Поки що це демонстраційний інтерфейс: записи не синхронізуються і не зберігаються після перезавантаження сторінки. Наступний етап — авторизація, база даних і справжні особисті та спільні простори.</div>`}
function taskPage(){return header('Завдання','Твої справи в одному зручному списку.')+`<div class="panel"><div class="panel-title">Усі завдання · ${tasks.filter(t=>!t.done).length} активних</div>${taskList()}<form class="add" id="addTask"><input id="taskText" placeholder="Нове завдання…" maxlength="180" required aria-label="Назва завдання"><button class="primary" type="submit">Додати</button></form></div><div class="banner">Демо-режим: нові завдання зникнуть після оновлення сторінки.</div>`}
function notesPage(){return header('Нотатки','Місце для всіх важливих думок, знань та матеріалів.')+`<div class="panel"><div class="panel-title">Твої записи</div>${noteList()}<div class="section-heading"><h2>Швидка нотатка</h2></div><form id="addNote"><input class="searchbar" id="noteTitle" placeholder="Назва нотатки" maxlength="120" required><textarea id="noteBody" class="textarea" style="min-height:140px;margin-top:10px" placeholder="Почни писати…" required></textarea><button class="primary" style="margin-top:10px">Створити нотатку</button></form></div><div class="banner">Демо-режим: нотатки зберігаються лише до оновлення сторінки.</div>`}
function projects(){return header('Проєкти','Збирай в одному місці все, що стосується твоїх планів.')+`<div class="project-list">${projectData.map(p=>`<div class="project"><span style="font-size:25px">${p[0]}</span><div><div class="project-title">${p[1]}</div><div class="project-sub">${p[2]}</div></div><span class="arrow">↗</span></div>`).join('')}</div><div class="banner">Це приклади майбутніх проєктів. Редагування й вкладені сторінки додамо пізніше.</div>`}
function modulePage(id){const data={goals:['Цілі','Визначай напрямок розвитку та відстежуй прогрес.','🎯','Плани та ключові результати'],food:['Харчування','Рецепти, продуктові списки та щоденник калорій.','🥗','Рецепти · Меню · Калорії'],fitness:['Тренування','Вправи, програми, історія й графіки результатів.','🏋️','Вправи · Журнал · Прогрес'],finance:['Фінанси','Особистий та сімейний бюджет в одному місці.','💳','Витрати · Доходи · Цілі'],ideas:['Ідеї','Збирай те, до чого захочеш повернутися пізніше.','💡','Задуми · Натхнення · Чернетки'],personal:['Особистий простір','Твої приватні матеріали та персональні модулі.','🔒','Особисті записи'],shared:['Спільний простір','Місце для спільних планів, рецептів і проєктів.','🤝','Спільна робота'],settings:['Налаштування','Персоналізація FerentsOS.','⚙','Тема та майбутні можливості']}[id];return header(data[0],data[1])+`<div class="module-card"><div style="font-size:34px">${data[2]}</div><h3>${data[3]}</h3><p>Цей розділ уже є в навігації, але його функції поки не створені. Ми зможемо поступово наповнити його інструментами під твої потреби.</p><div style="margin-top:19px"><span class="chip">У планах</span></div></div>${id==='settings'?'<p style="margin-top:24px"><button id="themeInSettings" class="primary">Перемкнути тему</button></p>':''}`}
function searchPage(){return header('Пошук','Шукай у демонстраційних завданнях і нотатках.')+`<input id="searchInput" class="searchbar" type="search" placeholder="Що шукаємо?" autocomplete="off"><div id="searchResults" class="panel" style="margin-top:14px"><p class="empty">Почни вводити запит.</p></div>`}
function setPage(p){current=sections[p]?p:'home';document.getElementById('crumb').textContent=sections[current];document.getElementById('page').innerHTML=({home,notes:notesPage,tasks:taskPage,projects,search:searchPage}[current]||(()=>modulePage(current)))();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('on');window.scrollTo(0,0); if(p==='search')document.getElementById('searchInput').focus()}
function renderNav(){document.getElementById('nav').innerHTML=navGroups.map(g=>`<div class="group-label">${g.name}</div>${g.items.map(([id,icon,name])=>`<button class="item" data-page="${id}"><span class="ico">${icon}</span><span>${name}</span></button>`).join('')}`).join('')}
function theme(){document.documentElement.classList.toggle('dark');try{localStorage.setItem('ferentsos-theme',document.documentElement.classList.contains('dark')?'dark':'light')}catch(e){}}
try{if(localStorage.getItem('ferentsos-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}
renderNav();setPage('home');
document.addEventListener('click',e=>{let el=e.target.closest('[data-page]');if(el){setPage(el.dataset.page)}if(e.target.id==='themeBtn'||e.target.id==='themeSide'||e.target.id==='themeInSettings')theme();if(e.target.id==='searchBtn')setPage('search')});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){tasks[Number(e.target.dataset.check)].done=e.target.checked;setPage(current)}});
document.addEventListener('submit',e=>{if(e.target.id==='addTask'){e.preventDefault();let field=document.getElementById('taskText');if(field.value.trim()){tasks.push({title:field.value.trim(),date:'Без дати',done:false});setPage('tasks');notice('Завдання додано (демо)')}}if(e.target.id==='addNote'){e.preventDefault();let title=document.getElementById('noteTitle').value.trim(),body=document.getElementById('noteBody').value.trim();if(title&&body){notes.unshift({title,desc:body.slice(0,90),body});setPage('notes');notice('Нотатку створено (демо)')}}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){const q=e.target.value.trim().toLocaleLowerCase('uk');const target=document.getElementById('searchResults');if(!q){target.innerHTML='<p class="empty">Почни вводити запит.</p>';return}const hits=[...tasks.filter(t=>t.title.toLocaleLowerCase('uk').includes(q)).map(t=>['☑',t.title,'Завдання']),...notes.filter(n=>(n.title+' '+n.body).toLocaleLowerCase('uk').includes(q)).map(n=>['▤',n.title,'Нотатка'])];target.innerHTML=hits.length?hits.map(h=>`<div class="note-row"><span class="ico">${h[0]}</span><div><strong>${esc(h[1])}</strong><small>${h[2]}</small></div></div>`).join(''):'<p class="empty">Нічого не знайдено.</p>'}});
document.getElementById('menuBtn').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('on')};document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('on')};
</script></body></html>
